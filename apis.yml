name: Quantive (fka Gtmhub)
description: >-
  Quantive (formerly Gtmhub) is a strategy-execution and OKR (Objectives and Key
  Results) SaaS platform, historically backed by Insight Partners. The company
  and its "Quantive Results" product have since been acquired and folded into
  WorkBoard — quantive.com now redirects to workboard.com and the developer
  portal (developer.quantive.com) has been decommissioned. The public REST API
  and OpenAPI reference are no longer reachable, but first-party developer
  tooling remains published on public registries: the @gtmhub/sdk extensibility
  SDK on npm (for building marketplace plugins and insights) and the gtmhub-cli
  command-line client (distributed via Homebrew, Chocolatey, and GitHub
  releases). This profile captures the surviving developer surface.
